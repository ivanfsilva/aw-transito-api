spring.application.name=aw-transito-api

# Conexão com o MySQL no Docker
spring.datasource.url=jdbc:mysql://localhost/awtransito?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Exibição das queries SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect