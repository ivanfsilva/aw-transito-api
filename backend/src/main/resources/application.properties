spring.application.name=aw-transito-api

# Conexao com o MySQL no Docker
spring.datasource.url=jdbc:mysql://localhost:3306/awtransito?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Exibicao das queries SQL no console
spring.jpa.show-sql=true

# Configuracao do Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true